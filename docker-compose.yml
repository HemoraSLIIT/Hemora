version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hemora_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hemoradb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hemora25}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - hemora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hemora_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - DB_NAME=${DB_NAME:-hemoradb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-hemora25}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:5173,http://frontend:80
      - MODEL_PATH=/app/data/models/
      - DEFAULT_MODEL=blood_disease_classifier.pth
      - CONFIDENCE_THRESHOLD=0.8
      - MAX_UPLOAD_SIZE=10485760
      - ALLOWED_IMAGE_EXTENSIONS=jpg,jpeg,png,tif,tiff
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./ml_models:/app/ml_models
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - hemora_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: hemora_frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - hemora_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  hemora_network:
    driver: bridge

volumes:
  postgres_data:
  media_files:
  static_files:
